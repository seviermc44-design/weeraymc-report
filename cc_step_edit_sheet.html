              <div className="flex items-center gap-3 self-start md:self-auto">
                <div className="rounded-full border border-zinc-200 bg-white px-3.5 py-2 flex items-center gap-2.5 shadow-sm">
                  <div className="text-[11px] uppercase tracking-widest text-zinc-500">Progress</div>
                  <div className="h-1.5 w-20 rounded-full bg-zinc-100 overflow-hidden">
                    <div className="h-full bg-zinc-900 transition-all" style={{ width: pct + "%" }} />
                  </div>
                  <div className="text-[12px] font-mono font-medium tabular-nums">{doneCount}/{totalTasks} • {pct}%</div>
                </div>
              </div>
            </div>
          </header>

          <main className="mx-auto max-w-[1120px] px-4 md:px-6 py-6 md:py-8">

            {/* 4. แสดงผล PROJECT REGISTRY */}
            <section className="rounded-[16px] border border-zinc-200 bg-white shadow-sm overflow-hidden mb-8">
              <div className="px-5 md:px-6 py-4 border-b border-zinc-100 flex items-center justify-between">
                <h2 className="text-[13px] font-semibold tracking-[0.08em] uppercase">🏛️ Project Registry — MC GROUP Ecosystem</h2>
                <span className="text-[11px] text-zinc-500">Version 6.0</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-[12.5px] leading-[1.4] border-collapse">
                  <thead>
                    <tr className="bg-zinc-50 text-zinc-500 text-[11px] uppercase tracking-widest">
                      <th className="text-left font-medium px-4 py-3">Project</th>
                      <th className="text-left font-medium px-4 py-3">Type</th>
                      <th className="text-left font-medium px-4 py-3">Status</th>
                      <th className="text-center font-medium px-4 py-3 w-[100px]">Priority</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-zinc-100">
                    {PROJECTS.map((p, i) => {
                      const prioColor = p.priority === "P1" ? "bg-zinc-900 text-white border-zinc-900" 
                                      : p.priority === "P2" ? "bg-blue-50 text-blue-700 border-blue-200"
                                      : p.priority === "P3" ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                                      : "bg-zinc-100 text-zinc-600 border-zinc-200";
                      return (
                        <tr key={i} className="hover:bg-zinc-50/60">
                          <td className="px-4 py-3 font-semibold">{p.name}</td>
                          <td className="px-4 py-3 text-zinc-600">{p.type}</td>
                          <td className="px-4 py-3 text-zinc-600">{p.status}</td>
                          <td className="text-center px-2 py-3">
                            <span className={`inline-flex min-w-[40px] justify-center rounded-full px-2 py-1 text-[11px] font-bold border ${prioColor}`}>{p.priority}</span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </section>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5 mb-8">
              {Object.entries(TYPES).map(([key, t]) => (
                <div key={key} className={`rounded-[12px] border ${t.bg} px-3.5 py-3 flex items-center gap-3`}>
                  <div className="h-7 w-7 rounded-full bg-white border flex items-center justify-center text-[14px] shadow-sm">{t.icon}</div>
                  <div>
                    <div className={`text-[13px] font-semibold ${t.color} leading-none`}>
                      {t.labelTh} <span className="opacity-60 font-normal">({t.labelEn})</span>
                    </div>
                    <div className="text-[11px] text-zinc-500 mt-1 uppercase tracking-widest">{key}</div>
                  </div>
                </div>
              ))}
            </div>

            <section className="rounded-[16px] border border-zinc-200 bg-white shadow-sm overflow-hidden mb-8">
              <div className="px-5 md:px-6 py-4 border-b border-zinc-100 flex items-center justify-between">
                <h2 className="text-[13px] font-semibold tracking-[0.08em] uppercase">📊 ตารางเทียบเร็ว — Quick Comparison</h2>
                <span className="text-[11px] text-zinc-500">BY เป็นฐาน → แปลงเป็นอีก 4 ประเภท</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-[12.5px] leading-[1.4] border-collapse">
                  <thead>
                    <tr className="bg-zinc-50 text-zinc-500 text-[11px] uppercase tracking-widest">
                      <th className="text-left font-medium px-4 py-3 w-[260px] sticky left-0 bg-zinc-50 border-r border-zinc-100">การแก้ (Edit Action)</th>
                      {["BY","BY-SA","BY-NC","BY-ND","BY-NC-ND"].map(h => (
                        <th key={h} className="text-center font-semibold px-3 py-3">{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-zinc-100">
                    {COMPARISON.map((row, i) => (
                      <tr key={i} className="hover:bg-zinc-50/60">
                        <td className="px-4 py-2.5 font-medium sticky left-0 bg-white border-r border-zinc-100">{row.label}</td>
                        {row.vals.map((v, j) => {
                          const cls = v.includes("✅") ? "bg-zinc-900 text-white border-zinc-900"
                            : v.includes("🟢") ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                            : v.includes("✏️") ? "bg-amber-50 text-amber-800 border-amber-200"
                            : (v.includes("เก็บ") || v.includes("คงไว้")) ? "bg-blue-50 text-blue-700 border-blue-200"
                            : "bg-zinc-50 text-zinc-400 border-zinc-200";
                          return (
                            <td key={j} className="text-center px-2 py-2.5">
                              <span className={`inline-flex min-w-[56px] justify-center rounded-full px-2 py-1 text-[11px] font-medium border ${cls}`}>{v}</span>
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="px-5 py-3 bg-amber-50/50 border-t border-amber-100 text-[11px] text-amber-800 flex gap-2">
                <span>⚠️</span>
                <span>BY-NC-ND ใช้ "and provided..." ส่วน BY-ND ใช้ "provided..." ต่างกันคำ "and" — อย่าสลับ</span>
              </div>
            </section>

            <div className="flex md:hidden gap-1.5 overflow-x-auto pb-3 -mx-1 px-1">
              {FILES.map(f => {
                const n = f.tasks.filter(t => done.has(`${f.id}-${t.no}`)).length;
                return (
                  <button
                    key={f.id}
                    onClick={() => goTo(f.id)}
                    className={`whitespace-nowrap rounded-full px-3.5 py-2 text-[12px] font-medium border transition ${active === f.id ? "bg-zinc-900 text-white border-zinc-900" : "bg-white border-zinc-200 text-zinc-600"}`}
                  >
                    {f.id.toUpperCase()} • {n}/{f.tasks.length}
                  </button>
                );
              })}
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">

              <aside className="hidden md:block lg:col-span-3">
                <div className="sticky top-[92px] rounded-[16px] border border-zinc-200 bg-white p-3">
                  <div className="px-2 py-2 text-[11px] uppercase tracking-widest text-zinc-500 font-medium">Files • ไฟล์</div>
                  <div className="space-y-1.5">
                    {FILES.map(f => {
                      const n = f.tasks.filter(t => done.has(`${f.id}-${t.no}`)).length;
                      const isActive = active === f.id;
                      return (
                        <button
                          key={f.id}
                          onClick={() => goTo(f.id)}
                          className={`w-full text-left rounded-[12px] border px-3 py-3 transition ${isActive ? "bg-zinc-900 text-white border-zinc-900" : "bg-zinc-50 border-zinc-200 hover:bg-white"}`}
                        >
                          <div className="flex items-center justify-between gap-2">
                            <div className={`h-6 w-6 rounded-full grid place-items-center text-[11px] font-bold ${isActive ? "bg-white text-zinc-900" : "bg-zinc-900 text-white"}`}>{f.tasks.length}</div>
                            <div className={`text-[11px] font-mono px-2 py-0.5 rounded-full border ${isActive ? "bg-white/15 border-white/20 text-white" : "bg-white border-zinc-200 text-zinc-500"}`}>{n}/{f.tasks.length}</div>
                          </div>
                          <div className={`mt-2 text-[13px] font-semibold leading-[1.2] ${isActive ? "text-white" : "text-zinc-900"}`}>{f.titleTh}</div>
                          <div className={`text-[11px] ${isActive ? "text-white/60" : "text-zinc-500"}`}>{f.filename}</div>
                          <div className="mt-2 h-1 rounded-full bg-black/10 overflow-hidden">
                            <div className={`h-full transition-all ${isActive ? "bg-white" : "bg-zinc-900"}`} style={{ width: (n / f.tasks.length * 100) + "%" }} />
                          </div>
                        </button>
                      );
                    })}
                  </div>
                  <div className="mt-3 px-2 py-2 rounded-[10px] bg-zinc-50 border border-zinc-100">
                    <div className="text-[11px] text-zinc-600 leading-relaxed">คลิก checkbox เพื่อทำเครื่องหมายว่าแก้เสร็จแล้ว — บันทึกอัตโนมัติในเบราว์เซอร์</div>
                  </div>
                </div>
              </aside>

              <div className="lg:col-span-9 space-y-6">
                {visibleFiles.map(f => {
                  const n = f.tasks.filter(t => done.has(`${f.id}-${t.no}`)).length;
                  const complete = n === f.tasks.length;
                  return (
                    <section
                      key={f.id}
                      id={f.id}
                      className={`rounded-[18px] border bg-white shadow-sm overflow-hidden ${complete ? "border-emerald-200 ring-1 ring-emerald-100" : "border-zinc-200"}`}
                    >
                      <div className={`px-5 md:px-6 py-4 flex items-center justify-between gap-4 ${f.color} text-white`}>
                        <div className="flex items-center gap-3">
                          <div className="h-9 w-9 rounded-[11px] bg-white/15 backdrop-blur grid place-items-center text-[12px] font-bold tracking-widest border border-white/20">{f.id.toUpperCase()}</div>
                          <div>
                            <h3 className="text-[14px] md:text-[15px] font-semibold leading-tight">
                              {f.titleTh} <span className="opacity-70 font-normal">— {f.titleEn}</span>
                            </h3>
                            <div className="text-[11px] opacity-80 font-mono mt-0.5">{f.filename} • {f.count} items</div>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <div className="hidden md:flex items-center gap-2 rounded-full bg-white/15 border border-white/20 px-3 py-1.5">
                            <div className="text-[11px] uppercase tracking-widest opacity-80">Done</div>
                            <div className="text-[13px] font-mono font-medium tabular-nums">{n}/{f.tasks.length}</div>
                          </div>
                          {complete && <div className="h-7 w-7 rounded-full bg-white text-emerald-700 grid place-items-center">✓</div>}
                        </div>
                      </div>

                      {f.keepNotes?.length > 0 && (
                        <div className="px-5 md:px-6 py-3 bg-blue-50/70 border-b border-blue-100 flex flex-col gap-1">
                          {f.keepNotes.map((note, i) => (
                            <div key={i} className="text-[11.5px] text-blue-800 flex gap-1.5">
                              <span>⚠️</span><span>{note}</span>
                            </div>
                          ))}
                        </div>
                      )}

                      <div className="divide-y divide-zinc-100">
                        {f.tasks.map(t => {
                          const key = `${f.id}-${t.no}`;
                          const isDone = done.has(key);
                          const type = TYPES[t.type];
                          return (
                            <label key={t.no} className={`group flex gap-3 md:gap-4 px-4 md:px-6 py-3.5 cursor-pointer transition ${isDone ? "bg-zinc-50/70" : "hover:bg-zinc-50/50"}`}>
                              <input type="checkbox" checked={isDone} onChange={() => toggle(f.id, t.no)} className="sr-only" />
                              <div className={`mt-0.5 h-[22px] w-[22px] shrink-0 rounded-[7px] border-2 grid place-items-center transition ${isDone ? "bg-zinc-900 border-zinc-900 text-white" : "bg-white border-zinc-300 group-hover:border-zinc-400"}`}>
                                {isDone && <span className="text-[12px] leading-none">✓</span>}
                              </div>
                              <div className="min-w-0 flex-1">
                                <div className="flex flex-wrap items-center gap-2">
                                  <span className="text-[11px] font-mono font-medium text-zinc-500 tabular-nums">#{t.no}</span>
                                  <span className={`inline-flex items-center gap-1 rounded-full border px-2.5 py-1 text-[11px] font-medium ${type.bg} ${type.color}`}>
                                    <span>{type.icon}</span>{type.labelTh} ({type.labelEn})
                                  </span>
                                  <span className="text-[11px] font-mono px-2 py-1 rounded-full bg-zinc-100 border border-zinc-200 text-zinc-600">{t.loc}</span>
                                  {isDone && <span className="text-[10px] uppercase tracking-widest text-emerald-700 font-medium">done • เสร็จ</span>}
                                </div>
                                <div className={`mt-2 text-[13.5px] leading-[1.45] ${isDone ? "text-zinc-500 line-through decoration-zinc-300" : "text-zinc-900"}`}>
                                  <span className="font-medium">{t.th}</span>
                                  <span className="text-zinc-500 font-normal"> — {t.en}</span>
                                </div>
                                {t.code && (
                                  <div className="mt-2 rounded-[10px] border border-zinc-200 bg-zinc-50 px-3 py-2.5 flex items-start gap-2">
                                    <div className="text-[10px] uppercase tracking-widest text-zinc-400 mt-0.5 shrink-0">phrase</div>
                                    <code className="text-[12px] leading-[1.5] text-zinc-700 break-words">{t.code}</code>
                                  </div>
                                )}
                              </div>
                            </label>
                          );
                        })}
                      </div>

                      <div className="px-5 md:px-6 py-3 bg-zinc-50 border-t border-zinc-100 flex items-center justify-between">
                        <div className="text-[11px] text-zinc-500">เรียงพยัญชนะ definition ใหม่หลังลบ → <span className="font-mono">🔢 reletter (A)(B)(C)...</span></div>
                        <div className="text-[11px] font-mono text-zinc-400">{f.filename}</div>
                      </div>
                    </section>
                  );
                })}

                <section className="rounded-[18px] border border-amber-200 bg-amber-50/50 p-5 md:p-6">
                  <h2 className="text-[14px] font-semibold flex items-center gap-2">
                    <span className="h-6 w-6 rounded-full bg-amber-600 text-white grid place-items-center text-[12px]">!</span>
                    จุดที่คนพลาดบ่อย — Common Pitfalls (5 points)
                  </h2>
                  <div className="mt-4 grid gap-3">
                    {PITFALLS.map((p, i) => (
                      <div key={i} className="rounded-[12px] border border-amber-200 bg-white px-4 py-3.5 flex gap-3">
                        <div className="h-7 w-7 rounded-full bg-zinc-900 text-white grid place-items-center text-[12px] font-bold shrink-0">{i + 1}</div>
                        <div className="min-w-0">
                          <div className="text-[13px] font-medium leading-[1.4]">{p.th}</div>
                          <div className="text-[12px] text-zinc-600 mt-1">{p.en}</div>
                          <div className="mt-2 text-[11px] font-mono bg-zinc-50 border border-zinc-200 rounded-[8px] px-2.5 py-2 text-zinc-700 leading-relaxed">{p.detail}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

                <footer className="py-6 text-center">
                  <div className="inline-flex flex-col items-center gap-2 rounded-full border border-zinc-200 bg-white px-5 py-3">
                    <div className="text-[11px] uppercase tracking-[0.12em] text-zinc-500">Next Step</div>
                    <div className="text-[13px] text-zinc-700">พอได้ BY-NC-SA ไทยเมื่อไหร่ → Apply ตารางนี้ทั้ง 5 ไฟล์ → ออกมาเป็น HTML ครบ UTF-8 พร้อม &lt;b&gt;, &lt;li&gt;, ลำดับ (a)(1)(A)</div>
                  </div>
                </footer>

              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(React.StrictMode, null, React.createElement(App))
    );
  </script>
</body>
</html>
